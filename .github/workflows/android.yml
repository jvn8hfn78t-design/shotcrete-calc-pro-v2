name: Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Compilar aplicación web
        env:
          CAPACITOR_BUILD: "true"
        run: bun run build

      - name: Diagnosticar salida del build
        run: |
          echo "========================================"
          echo "RAÍZ DEL PROYECTO"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "CARPETA DIST"
          echo "========================================"
          find dist -maxdepth 5 -type f 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "CARPETA OUTPUT"
          echo "========================================"
          find .output -maxdepth 7 -type f 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "TODOS LOS INDEX.HTML"
          echo "========================================"
          find . -type f -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./android/*" \
            -not -path "./.git/*" \
            -print

      - name: Instalar Capacitor CLI
        run: bunx cap --version

      - name: Crear proyecto Android
        run: bunx cap add android

      - name: Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Preparar ícono nativo de Android
        run: |
          mkdir -p resources
          convert public/icons/IMG_9962.jpeg -auto-orient PNG32:resources/icon.png
          bunx @capacitor/assets generate --android

      - name: Sincronizar Capacitor
        run: bunx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Recuperar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/shotcrete-release.keystore

          echo "Keystore recuperada:"
          ls -lh android/shotcrete-release.keystore

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verificar keystore
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "========================================"
          echo "VERIFICANDO KEYSTORE"
          echo "========================================"

          keytool -list \
            -keystore shotcrete-release.keystore \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "Keystore válida."

      - name: Firmar APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -type f -name "*unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: No se encontró el APK Release sin firmar."
            find app/build/outputs -type f
            exit 1
          fi

          echo "APK encontrado:"
          echo "$UNSIGNED_APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d | sort -V | tail -n 1)

          echo "Build Tools:"
          echo "$BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$UNSIGNED_APK" \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks shotcrete-release.keystore \
            --ks-key-alias shotcrete \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app-release.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose app-release.apk

          echo ""
          echo "========================================"
          echo "APK RELEASE FIRMADO CORRECTAMENTE"
          echo "========================================"

          ls -lh app-release.apk

      - name: Guardar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: shotcrete-calc-batch-release
          path: android/app-release.apk
